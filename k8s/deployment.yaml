apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-app
  namespace: sentiment-app
  labels:
    app: sentiment-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-app
  template:
    metadata:
      labels:
        app: sentiment-app
    spec:
      containers:
        - name: sentiment-app
          image: 274118516897.dkr.ecr.ap-south-1.amazonaws.com/sentiment-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8501
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8501
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20

