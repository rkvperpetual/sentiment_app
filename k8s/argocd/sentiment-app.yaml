
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sentiment-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rkvperpetual/sentiment_app.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: sentiment-app

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

